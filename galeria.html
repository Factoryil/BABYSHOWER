<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galería — Invitaciones Baby Shower Steven</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --sky: #5eb8e8;
        --lavender: #8f6fb3;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Quicksand", sans-serif;
        min-height: 100dvh;
        background:
          url("assets/fondo-nubes.png") center / cover no-repeat fixed,
          var(--sky);
        color: #4a3a5c;
        padding: 1.25rem;
      }

      .top {
        max-width: 1100px;
        margin: 0 auto 1.25rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: center;
        justify-content: space-between;
      }

      h1 {
        font-size: clamp(1.2rem, 3vw, 1.7rem);
        color: #fff;
        text-shadow: 0 2px 10px rgba(40, 80, 120, 0.4);
      }

      .back {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.55rem 0.95rem;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.92);
        color: var(--lavender);
        text-decoration: none;
        font-weight: 700;
        box-shadow: 0 6px 18px rgba(40, 70, 110, 0.22);
      }

      .grid {
        max-width: 1100px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 1rem;
      }

      .item {
        background: rgba(255, 255, 255, 0.92);
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 10px 28px rgba(40, 70, 110, 0.22);
        text-decoration: none;
        color: inherit;
        transition: transform 0.2s ease;
      }

      .item:hover {
        transform: translateY(-4px);
      }

      .item img {
        display: block;
        width: 100%;
        aspect-ratio: 3 / 4.25;
        object-fit: cover;
        background: #fff;
      }

      .item p {
        padding: 0.65rem 0.75rem 0.85rem;
        font-size: 0.82rem;
        font-weight: 600;
        line-height: 1.3;
      }

      .item span {
        display: block;
        color: var(--lavender);
        font-size: 0.72rem;
        margin-bottom: 0.2rem;
      }
    </style>
  </head>
  <body>
    <div class="top">
      <h1>Invitaciones Baby Shower Steven</h1>
      <a class="back" href="index.html">← Volver a la carta</a>
    </div>
    <div class="grid" id="grid"></div>
    <script src="invitados.js"></script>
    <script>
      const grid = document.getElementById("grid");
      const pad = (n) => String(n).padStart(2, "0");

      (window.INVITADOS || []).forEach((nombre, i) => {
        const file = `invitaciones/${pad(i + 1)} - ${nombre}.png`;
        const a = document.createElement("a");
        a.className = "item";
        a.href = file;
        a.target = "_blank";
        a.innerHTML = `
          <img src="${encodeURI(file)}" alt="Invitación ${nombre}" loading="lazy" />
          <p><span>${pad(i + 1)}</span>${nombre}</p>
        `;
        grid.appendChild(a);
      });
    </script>
  </body>
</html>
