<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Baby Shower — ¡Hasta el infinito y más allá!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="sky" aria-hidden="true"></div>

    <main class="stage">
      <div class="scene" id="scene">
        <button
          class="envelope"
          id="envelope"
          type="button"
          aria-label="Abrir invitación"
        >
          <div class="envelope-shadow"></div>
          <div class="envelope-back"></div>
          <div class="envelope-pocket"></div>
          <div class="envelope-flap"></div>
          <div class="wax-seal"><span>∞</span></div>
        </button>

        <article class="card" id="card" aria-hidden="true">
          <div class="card-tilt" id="cardTilt">
            <div class="card-inner" id="cardInner">
              <img
                src="assets/invitacion.png"
                alt="Invitación Baby Shower"
                class="card-image"
                draggable="false"
              />

              <div class="card-data">
                <p class="data-honor-label">EN HONOR A</p>
                <p class="data-name" id="dataName">—</p>
                <p class="data-parents" id="dataParents">—</p>

                <ul class="data-list">
                  <li>
                    <span class="data-label">Fecha</span>
                    <span class="data-value" id="dataFecha">—</span>
                  </li>
                  <li>
                    <span class="data-label">Hora</span>
                    <span class="data-value" id="dataHora">—</span>
                  </li>
                  <li>
                    <span class="data-label">Lugar</span>
                    <span class="data-value" id="dataLugar">—</span>
                  </li>
                  <li>
                    <span class="data-label">Confirma</span>
                    <span class="data-value" id="dataConfirma">—</span>
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </article>
      </div>

      <button class="save-btn" id="saveBtn" type="button" hidden>
        Guardar invitación
      </button>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
